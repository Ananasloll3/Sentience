# Publication automatique sur CurseForge (et Modrinth) à chaque version publiée sur GitHub.
#
# Activation, une seule fois (Settings du dépôt > Secrets and variables > Actions) :
#   CurseForge : variable CURSEFORGE_ID  = ID numérique du projet (encadré « About Project »)
#                secret   CURSEFORGE_TOKEN = jeton d'API (CurseForge > My API Tokens)
#   Modrinth   : variable MODRINTH_ID     = ID du projet (optionnel)
#                secret   MODRINTH_TOKEN  = jeton personnel (optionnel)
# Une plateforme sans jeton est simplement ignorée. Même sans rien configurer, le jar est
# joint automatiquement à la version GitHub.
#
# Utilisation : mettre mod_version à jour dans gradle.properties, pousser, puis publier une
# version GitHub avec le tag correspondant (ex. v0.2.0). Le changelog = le texte de la version.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version-type:
        description: Type de version
        type: choice
        options: [release, beta, alpha]
        default: release

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Version (depuis gradle.properties)
        id: meta
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft=$MC" >> "$GITHUB_OUTPUT"
          TYPE="${{ inputs.version-type }}"
          if [ -z "$TYPE" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then TYPE=beta; else TYPE=release; fi
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Publish (CurseForge / Modrinth / GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Joint le jar à la version GitHub (seulement quand le workflow vient d'une version publiée)
          github-token: ${{ github.event_name == 'release' && secrets.GITHUB_TOKEN || '' }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Sentience ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog: ${{ github.event.release.body }}

          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft }}
          java: 21
          dependencies: |
            fabric-api(required)
            simple-voice-chat(optional)
