plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { name = 'Henkelmax'; url = 'https://maven.maxhenkel.de/repository/public' }
}

// Mod de démo (Rôdeur, zombies améliorés) : séparé de la librairie, jamais publié
sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        sentience { sourceSet sourceSets.main }
        sentience_testmod { sourceSet sourceSets.testmod }
    }
    runs {
        // runClient / runServer : librairie seule
        // runTestmodClient / runTestmodServer : librairie + mobs de démo
        testmodClient {
            client()
            name = 'Testmod Client'
            source sourceSets.testmod
        }
        testmodServer {
            server()
            name = 'Testmod Server'
            source sourceSets.testmod
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Simple Voice Chat : API seulement, intégration optionnelle
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

processTestmodResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

// Le mod de démo doit toujours compiler avec l'API
tasks.named('check') { dependsOn 'compileTestmodJava' }
